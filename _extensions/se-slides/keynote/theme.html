<script>
// Copy over background colors to new div
divs = document.querySelectorAll('[data-background-color]');

Array.from(divs).map(function (x) {
  const color = x.dataset.backgroundColor;

  var new_div = document.createElement('div');
  new_div.setAttribute("class", "background-color-div");
  new_div.style.backgroundColor = color;
  x.appendChild(new_div);
  x.removeAttribute("data-background-color");
})

// Remove background colors from backgrounds div
Array.from(
  document.querySelectorAll("[data-background-hash]")
).map(function (x) {
  x.removeAttribute("data-background-hash");
  x.style.backgroundColor = null;
})
</script>

<script>
// Copy over background images to new div
divs = document.querySelectorAll('[data-background-image]');

Array.from(divs).map(function (x) {
  var new_div = document.createElement('div');
  new_div.setAttribute("class", "background-image-div");

  if (x.dataset.backgroundImage != undefined) {
    new_div.style.backgroundImage = "url(" + x.dataset.backgroundImage + ")";
    x.removeAttribute("data-background-image");
  }
  if (x.dataset.backgroundSize != undefined) {
    new_div.style.backgroundSize = x.dataset.backgroundSize;
    x.removeAttribute("data-background-size");
  }
  if (x.dataset.backgroundPosition != undefined) {
    new_div.style.backgroundPosition = x.dataset.backgroundPosition;
    x.removeAttribute("data-background-position");
  }
  if (x.dataset.backgroundRepeat != undefined) {
    new_div.style.backgroundRepeat = x.dataset.backgroundRepeat;
    x.removeAttribute("data-background-repeat");
  }
  if (x.dataset.backgroundOpacity != undefined) {
    new_div.style.backgroundOpacity = x.dataset.backgroundOpacity;
    x.removeAttribute("data-background-opacity");
  }

  x.appendChild(new_div);
})
</script>

<script>
// Copy over background vidoes

// Run once when we load
var video_div = document.querySelectorAll(".backgrounds video");
var slide_div = document.querySelectorAll("[data-background-video]");

for (let i = 0; i < video_div.length; i++) {
  video_div[i].setAttribute("class", "background-video-div");
  video_div[i].setAttribute("controls", "")

  slide_div[i].appendChild(video_div[i]);
  slide_div[i].removeAttribute("data-background-video");
}

  var video_div = document.querySelectorAll(".backgrounds video");
  var slide_div = document.querySelectorAll("[data-background-video]");

  for (let i = 0; i < video_div.length; i++) {
    video_div[i].setAttribute("class", "background-video-div");
    video_div[i].setAttribute("controls", "")

    slide_div[i].appendChild(video_div[i]);
    slide_div[i].removeAttribute("data-background-video");
  }

});
</script>

<script>
// References: a list taller than the slide is split over several slides with the same title and
// a page count ("References 1/2"), instead of one scrolling slide. Reveal is usually set up when this
// runs: it is synced, and the slide menu gets the new pages. Split again when the web fonts are
// loaded, if the lines wrap differently.
(function () {
  const refs = document.querySelector(".reveal .slides section #refs");
  if (refs === null) {
    return;
  }
  const slide = refs.closest("section");
  const entries = Array.from(refs.querySelectorAll(":scope > .csl-entry"));
  if (entries.length < 2) {
    return;
  }
  const config = Reveal.getConfig ? Reveal.getConfig() : {};
  const width = config.width || 1280, height = config.height || 720;
  let pages = [slide];

  function split() {
    // back to one slide
    pages.slice(1).forEach(page => page.remove());
    pages = [slide];
    entries.forEach(entry => refs.appendChild(entry));
    slide.querySelectorAll(".refs-page").forEach(span => span.remove());
    // measure the entries on the slide shown at its size, hidden
    const saved = slide.getAttribute("style");
    slide.style.cssText += `;display:block;visibility:hidden;width:${width}px;height:${height}px;overflow:visible`;
    const box = slide.getBoundingClientRect(), scale = box.height / height || 1;
    const top = e => (e.getBoundingClientRect().top - box.top) / scale;
    const bottom = e => (e.getBoundingClientRect().bottom - box.top) / scale;
    const start = top(entries[0]), limit = height - 16, groups = [[]];
    let offset = 0;
    entries.forEach(entry => {
      if (groups[groups.length - 1].length && bottom(entry) - offset > limit) {
        groups.push([]);
        offset = top(entry) - start;
      }
      groups[groups.length - 1].push(entry);
    });
    if (saved === null) slide.removeAttribute("style"); else slide.setAttribute("style", saved);
    if (groups.length === 1) {
      return;
    }
    // one slide per group
    slide.classList.remove("scrollable");
    groups.forEach((group, i) => {
      let page = slide;
      if (i > 0) {
        page = slide.cloneNode(true);
        page.id = `${slide.id}-${i + 1}`;
        page.classList.remove("present", "past", "future");
        page.removeAttribute("style");
        page.removeAttribute("hidden");
        page.removeAttribute("aria-hidden");
        page.querySelectorAll("aside.notes").forEach(notes => notes.remove());
        page.querySelector("#refs").removeAttribute("id");
        page.querySelectorAll(".csl-entry").forEach(entry => entry.remove());
        pages[pages.length - 1].after(page);
        pages.push(page);
      }
      const list = i === 0 ? refs : page.querySelector(".csl-bib-body");
      group.forEach(entry => list.appendChild(entry));
    });
    pages.forEach((page, i) => {
      const title = page.querySelector("h1, h2");
      if (title !== null) {
        title.insertAdjacentHTML("beforeend", ` <span class="refs-page">${i + 1}/${pages.length}</span>`);
      }
    });
  }

  // The slide menu lists the slides once: add the pages after the first one, and shift the
  // slides that follow them
  function updateMenu() {
    const items = Array.from(document.querySelectorAll(".slide-menu-wrapper li.slide-menu-item[data-slide-h]"));
    if (items.length === 0) {
      return;
    }
    items.filter(item => item.classList.contains("refs-menu-page")).forEach(item => item.remove());
    const first = Reveal.getIndices(slide).h, extra = pages.length - 1;
    let page1 = null;
    items.filter(item => !item.classList.contains("refs-menu-page")).forEach(item => {
      if (item.dataset.refsH === undefined) {
        item.dataset.refsH = item.dataset.slideH;
        item.dataset.refsItem = item.dataset.item;
      }
      const h = +item.dataset.refsH, shift = h > first ? extra : 0;
      item.dataset.slideH = h + shift;
      item.dataset.item = +item.dataset.refsItem + shift;
      if (h === first) {
        page1 = item;
      }
    });
    if (page1 === null) {
      return;
    }
    const label = i => `${(page1.dataset.refsTitle = page1.dataset.refsTitle || page1.textContent.trim())} ${i}/${pages.length}`;
    const title = item => item.querySelector(".slide-menu-item-title") || item;
    title(page1).textContent = pages.length > 1 ? label(1) : page1.dataset.refsTitle || title(page1).textContent;
    let last = page1;
    for (let i = 1; i < pages.length; i++) {
      const item = page1.cloneNode(true);
      item.classList.add("refs-menu-page");
      item.classList.remove("active", "past", "future");
      item.dataset.slideH = first + i;
      item.dataset.item = +page1.dataset.item + i;
      title(item).textContent = label(i + 1);
      item.addEventListener("click", () => Reveal.slide(+item.dataset.slideH));
      last.after(item);
      last = item;
    }
  }

  // Reveal set up already: take the new slides, stay on the slide shown or go to a page of the
  // list named in the address (#/references-2; on loading, Reveal has already replaced an address
  // it did not know, so take the one the page was opened with)
  function refresh(hash) {
    if (!Reveal.isReady()) {
      return;
    }
    const at = Reveal.getIndices();
    Reveal.sync();
    const named = pages.find(page => hash === `#/${page.id}`);
    if (named) {
      Reveal.slide(Reveal.getIndices(named).h);
    } else {
      Reveal.slide(at.h, at.v, at.f);
    }
    updateMenu();
  }

  const count = () => pages.map(page => page.querySelectorAll(".csl-entry").length).join();
  split();
  if (pages.length > 1) {
    const opened = performance.getEntriesByType ? performance.getEntriesByType("navigation")[0] : null;
    refresh(opened ? new URL(opened.name).hash : location.hash);
  }
  if (document.fonts && document.fonts.status !== "loaded") {
    const before = count();
    document.fonts.ready.then(() => {
      split();
      if (count() !== before) {
        refresh(location.hash);
      }
    });
  }
})();
</script>

<script>
// Print view: the footer and logo are single fixed elements, so copy them into
// a frame over the slide on every page, except on slides with a no-footer or
// no-logo class
function addPrintFooterAndLogo() {
  const pages = document.querySelectorAll(".pdf-page");
  if (pages.length === 0 || document.querySelector(".print-slide-frame")) {
    return;
  }

  const footer_div = document.querySelector(".footer-default");
  const logo_div = document.querySelector(".slide-logo");

  pages.forEach(page => {
    const slide = page.querySelector("section:not(.slide-background)");
    if (slide === null) {
      return;
    }
    const frame = document.createElement("div");
    frame.setAttribute("class", "print-slide-frame");
    if (footer_div !== null && !slide.classList.contains("no-footer") && slide.dataset.footer !== "false") {
      frame.appendChild(footer_div.cloneNode(true));
    }
    if (logo_div !== null && !slide.classList.contains("no-logo")) {
      frame.appendChild(logo_div.cloneNode(true));
    }
    page.appendChild(frame);
  });
}

Reveal.on('pdf-ready', addPrintFooterAndLogo);
Reveal.on('ready', addPrintFooterAndLogo);
</script>

<script>
// Remove footer on slide that have a no-footer class
Reveal.on('ready', () => {
    Reveal.on( 'slidechanged', event => {
        if (Array.from(event.currentSlide.classList).indexOf("no-footer") !== -1) {
            document.querySelector("div .footer").style.visibility = "hidden";
        } else {
            document.querySelector("div .footer").style.visibility = null;
        }
    });
})
</script>

<script>
// Infographics: key numbers (.stat .num) count up from zero each time their
// slide is shown, keeping their format (1 300, 0.38, −60…). Text that is not a
// number, and numbers with a no-count class (a year…), stay as they are.
(function () {
  const NUMBER = /^([−-]?)(\d{1,3}(?:([   ',])\d{3})+|\d+)(?:\.(\d+))?$/;

  function countUp(el) {
    if (!el.dataset.final) el.dataset.final = el.textContent.trim();
    const text = el.dataset.final;
    const m = text.match(NUMBER);
    if (!m) return;
    const sep = m[3] || "";
    const decimals = m[4] ? m[4].length : 0;
    const target = parseFloat(m[2].split(sep || "#").join("") + (m[4] ? "." + m[4] : ""));
    const format = v => {
      let [int, dec] = v.toFixed(decimals).split(".");
      if (sep) int = int.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
      return m[1] + int + (dec ? "." + dec : "");
    };
    if (document.hidden || document.documentElement.classList.contains("print-pdf")) {
      el.textContent = text;
      return;
    }
    const start = performance.now();
    cancelAnimationFrame(el.countFrame);
    const frame = now => {
      const t = Math.min((now - start) / 1100, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = t < 1 ? format(target * eased) : text;
      if (t < 1) el.countFrame = requestAnimationFrame(frame);
    };
    el.countFrame = requestAnimationFrame(frame);
  }

  function enter(slide) {
    if (slide) slide.querySelectorAll(".stat .num:not(.no-count)").forEach(countUp);
  }

  function start() {
    Reveal.on("slidechanged", e => enter(e.currentSlide));
    enter(Reveal.getCurrentSlide());
  }
  if (Reveal.isReady()) start();
  else Reveal.on("ready", start);
})();
</script>
