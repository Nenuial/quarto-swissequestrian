<script>
// Cover title slide (infographic.scss): the picture and the colours given in title-slide-attributes
// (data-cover, data-cover-accent, data-cover-blend). The picture's URL is made absolute here, so
// that it is relative to the deck and not to the theme's stylesheet.
(function () {
  const slide = document.getElementById("title-slide");
  if (slide === null || !slide.dataset.cover) {
    return;
  }
  slide.classList.add("cover");
  slide.style.setProperty("--cover-img", `url("${new URL(slide.dataset.cover, document.baseURI).href}")`);
  if (slide.dataset.coverAccent) {
    slide.style.setProperty("--cover-accent", slide.dataset.coverAccent);
  }
  if (slide.dataset.coverBlend) {
    slide.style.setProperty("--cover-blend", slide.dataset.coverBlend);
  }
})();
</script>

<script>
// Copy over background colors to new div
divs = document.querySelectorAll('[data-background-color]');

Array.from(divs).map(function (x) {
  const color = x.dataset.backgroundColor;

  var new_div = document.createElement('div');
  new_div.setAttribute("class", "background-color-div");
  new_div.style.backgroundColor = color;
  x.appendChild(new_div);
  x.removeAttribute("data-background-color");
})

// Remove background colors from backgrounds div
Array.from(
  document.querySelectorAll("[data-background-hash]")
).map(function (x) {
  x.removeAttribute("data-background-hash");
  x.style.backgroundColor = null;
})
</script>

<script>
// Copy over background images to new div
divs = document.querySelectorAll('[data-background-image]');

Array.from(divs).map(function (x) {
  var new_div = document.createElement('div');
  new_div.setAttribute("class", "background-image-div");

  if (x.dataset.backgroundImage != undefined) {
    new_div.style.backgroundImage = "url(" + x.dataset.backgroundImage + ")";
    x.removeAttribute("data-background-image");
  }
  if (x.dataset.backgroundSize != undefined) {
    new_div.style.backgroundSize = x.dataset.backgroundSize;
    x.removeAttribute("data-background-size");
  }
  if (x.dataset.backgroundPosition != undefined) {
    new_div.style.backgroundPosition = x.dataset.backgroundPosition;
    x.removeAttribute("data-background-position");
  }
  if (x.dataset.backgroundRepeat != undefined) {
    new_div.style.backgroundRepeat = x.dataset.backgroundRepeat;
    x.removeAttribute("data-background-repeat");
  }
  if (x.dataset.backgroundOpacity != undefined) {
    new_div.style.backgroundOpacity = x.dataset.backgroundOpacity;
    x.removeAttribute("data-background-opacity");
  }

  x.appendChild(new_div);
})
</script>

<script>

    slide_div[i].appendChild(video_div[i]);
    slide_div[i].removeAttribute("data-background-video");
  }

});
</script>

<script>
// Print view: the footer and logo are single fixed elements, so copy them into
// a frame over the slide on every page, except on slides with a no-footer or
// no-logo class and on chapter openers (.part); the licence and AI badges on the title page
function addPrintFooterAndLogo() {
  const pages = document.querySelectorAll(".pdf-page");
  if (pages.length === 0 || document.querySelector(".print-slide-frame")) {
    return;
  }

  const footer_div = document.querySelector(".footer-default");
  const logo_div = document.querySelector(".slide-logo");

  pages.forEach(page => {
    const slide = page.querySelector("section:not(.slide-background)");
    if (slide === null) {
      return;
    }
    const frame = document.createElement("div");
    frame.setAttribute("class", "print-slide-frame");
    if (footer_div !== null && !hidesFooter(slide) && slide.dataset.footer !== "false") {
      frame.appendChild(footer_div.cloneNode(true));
    }
    if (logo_div !== null && !hidesLogo(slide)) {
      frame.appendChild(logo_div.cloneNode(true));
    }
    const badges = document.querySelector(".title-badges");
    if (badges !== null && slide.id === "title-slide") {
      const copy = badges.cloneNode(true);
      copy.hidden = false;
      frame.appendChild(copy);
    }
    page.appendChild(frame);
  });
}

Reveal.on('pdf-ready', addPrintFooterAndLogo);
keynoteOnReady(addPrintFooterAndLogo);
</script>

<script>
// Hide the footer on slides with a no-footer class, the logo on slides with a no-logo class,
// and both on chapter openers (.part)
const hidesFooter = slide => slide.classList.contains("no-footer") || slide.classList.contains("part");
const hidesLogo = slide => slide.classList.contains("no-logo") || slide.classList.contains("part");
keynoteOnReady(() => {
  const footer = document.querySelector("div .footer"), logo = document.querySelector("div .slide-logo");
  const update = slide => {
    if (!slide) return;
    if (footer) footer.style.visibility = hidesFooter(slide) ? "hidden" : null;
    if (logo) logo.style.visibility = hidesLogo(slide) ? "hidden" : null;
  };
  update(Reveal.getCurrentSlide());
  Reveal.on('slidechanged', event => update(event.currentSlide));
});
</script>

<script>
// Licence and AI badges (badges.lua, after the slides): next to the logo, on the opposite side,
// shown on the title slide only (hidden inside an iframe by global.scss)
(function () {
  const setUp = () => {
    const badges = document.querySelector(".title-badges"), slides = document.querySelector(".reveal .slides");
    if (!badges || !slides) return;
    slides.appendChild(badges);
    const show = () => { badges.hidden = !(Reveal.getCurrentSlide() && Reveal.getCurrentSlide().id === "title-slide"); };
    show();
    Reveal.on("slidechanged", show);
  };
  const ready = () => { if (Reveal.isReady()) setUp(); else Reveal.on("ready", setUp); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", ready); else ready();
})();
</script>

<script>
// Inside an iframe (the vignettes of the GeoDoc site): always the scroll view, whatever the width of
// the frame (Reveal otherwise switches to it only below 435px, so a vignette came out one way or the
// other), the slides one after the other at the full width of the frame, without footer, logo or
// scrollbar (html.embedded in global.scss). Not in the speaker view, whose previews of the current and
// next slides are iframes too, loaded with ?receiver
if (window.self !== window.top && !/receiver/i.test(window.location.search)) {
  document.documentElement.classList.add("embedded");
  // Reveal scales a slide to fit the width and the height of the frame: in a low frame, minScale
  // makes it take the full width instead. Each slide is drawn a little smaller in its page
  // (global.scss), as there is no letterbox frame around it.
  const embed = () => Reveal.configure({
    scrollActivationWidth: 1e6,
    scrollLayout: "compact",
    scrollSnap: false,
    scrollProgress: false,
    margin: 0,
    minScale: document.documentElement.clientWidth / Reveal.getConfig().width
  });
  // the frame first shows the middle of the title slide, where the title is
  const centre = () => requestAnimationFrame(() => requestAnimationFrame(() => {
    const view = document.querySelector(".reveal-viewport");
    if (view) view.scrollTop = Math.max(0, (Reveal.getConfig().height * Reveal.getScale() - view.clientHeight) / 2);
  }));
  const start = () => { embed(); centre(); };
  if (Reveal.isReady()) start(); else Reveal.on("ready", start);
  window.addEventListener("resize", () => { if (Reveal.isReady()) embed(); });
} else if (/receiver/i.test(window.location.search)) {
  // the speaker view's previews: always slides, even when the frame is narrower than 435px
  const slides = () => Reveal.configure({ scrollActivationWidth: 0 });   // 0, not null: Reveal then leaves the scroll view
  if (Reveal.isReady()) slides(); else Reveal.on("ready", slides);
}
</script>

<script>
// Infographics: key numbers (.stat .num) count up from zero each time their
// slide is shown, keeping their format (1 300, 0.38, −60…). Text that is not a
// number, and numbers with a no-count class (a year…), stay as they are.
(function () {
  const NUMBER = /^([−-]?)(\d{1,3}(?:([   ',])\d{3})+|\d+)(?:\.(\d+))?$/;

  function countUp(el) {
    if (!el.dataset.final) el.dataset.final = el.textContent.trim();
    const text = el.dataset.final;
    const m = text.match(NUMBER);
    if (!m) return;
    const sep = m[3] || "";
    const decimals = m[4] ? m[4].length : 0;
    const target = parseFloat(m[2].split(sep || "#").join("") + (m[4] ? "." + m[4] : ""));
    const format = v => {
      let [int, dec] = v.toFixed(decimals).split(".");
      if (sep) int = int.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
      return m[1] + int + (dec ? "." + dec : "");
    };
    if (document.hidden || document.documentElement.classList.contains("print-pdf")) {
      el.textContent = text;
      return;
    }
    const start = performance.now();
    cancelAnimationFrame(el.countFrame);
    const frame = now => {
      const t = Math.min((now - start) / 1100, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = t < 1 ? format(target * eased) : text;
      if (t < 1) el.countFrame = requestAnimationFrame(frame);
    };
    el.countFrame = requestAnimationFrame(frame);
  }

  function enter(slide) {
    if (slide) slide.querySelectorAll(".stat .num:not(.no-count)").forEach(countUp);
  }

  function start() {
    Reveal.on("slidechanged", e => enter(e.currentSlide));
    enter(Reveal.getCurrentSlide());
  }
  if (Reveal.isReady()) start();
  else Reveal.on("ready", start);
})();
</script>
